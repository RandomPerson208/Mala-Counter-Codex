<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Mala Counter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="counter-card">
        <p class="eyebrow">Hare Krishna Japa</p>
        <h1>Mala Counter</h1>
        <p class="subtitle">Tap the altar button for each mantra. Your progress is saved on this device.</p>

        <div class="status-row" aria-label="Counter summary">
          <div class="stat">
            <span class="stat-label">Current bead</span>
            <strong class="stat-value" id="beadCount">0</strong>
          </div>
          <div class="stat">
            <span class="stat-label">Rounds</span>
            <strong class="stat-value" id="roundCount">0</strong>
          </div>
          <div class="stat">
            <span class="stat-label">Remaining</span>
            <strong class="stat-value" id="remainingCount">108</strong>
          </div>
        </div>

        <button class="counter-button" id="counterButton" type="button" aria-describedby="tapHint">
          <span class="ring" aria-hidden="true">
            <svg viewBox="0 0 220 220" class="progress-svg">
              <circle class="progress-track" cx="110" cy="110" r="100"></circle>
              <circle class="progress-fill" id="progressCircle" cx="110" cy="110" r="100"></circle>
            </svg>
          </span>
          <span class="button-photo-wrap">
            <img
              src="assets/radha-nila-madhava-button.png"
              alt="Devotional image inspired by Shri Shri Radha Nila Madhava"
              class="button-photo"
            />
          </span>
          <span class="tap-copy">
            <strong>Tap to Count</strong>
            <span id="tapHint">Each 108 taps completes one round.</span>
          </span>
        </button>

        <div class="action-row">
          <button class="secondary-button" id="undoButton" type="button">Undo</button>
          <button class="secondary-button secondary-button-reset" id="resetButton" type="button">Reset</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
